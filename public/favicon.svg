<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
    <!--
      A QR code favicon: three finder patterns in the corners plus a scatter of
      data modules, drawn on an 8x8 module grid (each module is 16px). Colours
      follow the OS theme, matching how the rest of the site behaves.
    -->
    <g class="qr">
        <!-- Top-left finder pattern -->
        <path d="M0 0h48v48H0V0Zm16 16v16h16V16H16Z" fill-rule="evenodd" />
        <!-- Top-right finder pattern -->
        <path d="M80 0h48v48H80V0Zm16 16v16h16V16H96Z" fill-rule="evenodd" />
        <!-- Bottom-left finder pattern -->
        <path d="M0 80h48v48H0V80Zm16 16v16h16V96H16Z" fill-rule="evenodd" />

        <!-- Data modules -->
        <rect x="64" y="0" width="16" height="16" />
        <rect x="48" y="16" width="16" height="16" />
        <rect x="64" y="32" width="16" height="16" />
        <rect x="0" y="64" width="16" height="16" />
        <rect x="32" y="64" width="16" height="16" />
        <rect x="48" y="64" width="16" height="16" />
        <rect x="80" y="64" width="16" height="16" />
        <rect x="112" y="64" width="16" height="16" />
        <rect x="64" y="80" width="16" height="16" />
        <rect x="96" y="80" width="16" height="16" />
        <rect x="80" y="96" width="16" height="16" />
        <rect x="112" y="96" width="16" height="16" />
        <rect x="64" y="112" width="16" height="16" />
        <rect x="96" y="112" width="16" height="16" />
    </g>
    <style>
        .qr { fill: #000; }
        @media (prefers-color-scheme: dark) {
            .qr { fill: #FFF; }
        }
    </style>
</svg>
